name: blog-og-check

# Build-time guard: every blog page must declare valid og:title,
# og:description, og:url, og:image and twitter card tags, and every
# referenced og:image file must exist. Fails the build (and opens an issue
# on a schedule miss) if any blog page regresses.

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "assets/blog/**"
      - "scripts/verify-blog-og.py"
      - ".github/workflows/blog-og-check.yml"
  pull_request:
    paths:
      - "blog/**"
      - "assets/blog/**"
      - "scripts/verify-blog-og.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify blog OG + Twitter Card metadata
        run: python3 scripts/verify-blog-og.py --check