name: footer-social-icon-check

# Build-time guard: footer social icon URLs (SPA Footer bundle +
# assets/footer-social-icons.js enhancer) must match the canonical
# brand handles used in JSON-LD / HTML, and every required platform
# (Facebook, Instagram, YouTube, X, Pinterest, IMDb) must be present.

on:
  push:
    branches: [main]
    paths:
      - "assets/Footer-*.js"
      - "assets/footer-social-icons.js"
      - "scripts/verify-footer-social-icons.py"
      - "scripts/verify-social-urls.py"
      - ".github/workflows/footer-social-icon-check.yml"
  pull_request:
    paths:
      - "assets/Footer-*.js"
      - "assets/footer-social-icons.js"
      - "scripts/verify-footer-social-icons.py"
      - "scripts/verify-social-urls.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify footer social icon URLs
        run: python3 scripts/verify-footer-social-icons.py