name: canonical-url-check

# Build-time guard: every indexable page's <link rel="canonical"> and
# <meta property="og:url"> must match the final URL Apache serves after
# its 301 redirects (https, apex host, trailing slash). Mismatches cause
# duplicate-content splits in Google and broken social previews because
# the cache key is the pre-redirect URL but the scraped content is the
# post-redirect URL.

on:
  push:
    branches: [main]
    paths:
      - "**/index.html"
      - ".htaccess"
      - "scripts/verify-canonical-urls.py"
      - ".github/workflows/canonical-url-check.yml"
  pull_request:
    paths:
      - "**/index.html"
      - ".htaccess"
      - "scripts/verify-canonical-urls.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical + og:url match final redirected URL
        run: python3 scripts/verify-canonical-urls.py