<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyword & AEO Audit | TKC Admin</title>
<style>body{font-family:system-ui,sans-serif;margin:24px;background:#0f0f12;color:#eee}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #2a2a30;padding:8px;text-align:left;vertical-align:top}th{background:#1a1a20;position:sticky;top:0}.Critical{color:#ff6b6b;font-weight:700}.High{color:#ffb84d}.Medium{color:#7ec8ff}.Low{color:#9a9}a{color:#d4a24c}.note{background:#1a1a20;padding:12px;border-radius:8px;max-width:900px}</style></head><body>
<h1>Keyword & AEO/SEO audit</h1><p class="note">Sources: Google Search Console (tkctalent.com, last 90 days), Semrush India monthly volume and difficulty, and an on-page review. <span id="p"></span> · <a href="keyword-audit.csv" download>Download CSV</a> · <a href="/admin/ai-visibility/">AI visibility dashboard →</a></p>
<table><thead><tr><th>Priority</th><th>Keyword</th><th>Volume/mo (IN)</th><th>Difficulty</th><th>Target page</th><th>Impr. 90d</th><th>Avg pos</th><th>Google shows</th><th>Status</th><th>Fix</th></tr></thead><tbody id="b"></tbody></table>
<script>fetch('audit.json').then(r=>r.json()).then(d=>{p.textContent='Period '+d.period;b.innerHTML=d.rows.map(r=>`<tr><td class="${r.priority}">${r.priority}</td><td>${r.keyword}</td><td>${r.volume_in??'—'}</td><td>${r.difficulty??'—'}</td><td>${r.target_page}</td><td>${r.impressions_90d}</td><td>${r.avg_position??'—'}</td><td>${r.page_google_shows}</td><td>${r.status}</td><td>${r.fix}</td></tr>`).join('')})</script></body></html>
