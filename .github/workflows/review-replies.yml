name: review-replies

# Auto-prepare owner replies for new Google Business Profile reviews.
# Drop new reviews into admin/reviews/inbox.json (via GBP API export, Zapier,
# or manual paste). This workflow runs the reply generator and commits
# admin/reviews/replies.json as an artifact for a human to paste back into GBP.

on:
  push:
    paths:
      - "admin/reviews/inbox.json"
      - "scripts/prepare-review-replies.py"
      - ".github/workflows/review-replies.yml"
  schedule:
    - cron: "0 5 * * *"   # 10:30 IST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare owner replies
        run: python3 scripts/prepare-review-replies.py
      - name: Upload prepared replies
        uses: actions/upload-artifact@v4
        with:
          name: review-replies
          path: admin/reviews/replies.json