<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>GSC Priority Pages Dashboard — TKC Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&family=Montserrat:wght@400;500;600;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#0a0a0a; --muted:#666; --line:#111; --accent:#d32f2f; --card:#fafafa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Montserrat",system-ui,sans-serif; }
  header { border-bottom:2px solid var(--line); padding:28px 32px; }
  h1 { font-family:"Questrial",sans-serif; font-size:28px; margin:0 0 6px; letter-spacing:-0.01em; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  main { padding:24px 32px 64px; max-width:1400px; margin:0 auto; }
  .page { border:1px solid var(--line); margin-bottom:28px; background:var(--bg); }
  .page > h2 { font-family:"Questrial",sans-serif; font-size:20px; margin:0; padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
  .page > h2 a { color:var(--accent); text-decoration:none; font-size:12px; font-family:"Montserrat"; font-weight:500; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; border-bottom:1px solid var(--line); }
  .stat { padding:14px 20px; border-right:1px solid #eee; }
  .stat:last-child{ border-right:none; }
  .stat .k { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .stat .v { font-family:"Questrial",sans-serif; font-size:22px; margin-top:4px; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:0; border-bottom:1px solid var(--line); }
  .chart-wrap { padding:16px 20px; border-right:1px solid #eee; }
  .chart-wrap:last-child{ border-right:none; }
  .chart-wrap h3 { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:0 0 8px; }
  .chart-wrap canvas { max-height:220px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 12px; text-align:left; border-bottom:1px solid #eee; }
  th { background:var(--card); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .up { color:#0a7d2f; font-weight:600; }
  .down { color:var(--accent); font-weight:600; }
  .flat { color:var(--muted); }
  @media (max-width: 900px){ .charts, .stats{grid-template-columns:1fr 1fr;} .stat:nth-child(2n){border-right:none;} }
</style>
</head>
<body>
<header>
  <h1>GSC Priority Pages Dashboard</h1>
  <p id="meta">Loading…</p>
</header>
<main id="root"></main>
<script>
const fmtPct = v => (v*100).toFixed(2)+'%';
const fmtPos = v => v ? v.toFixed(1) : '—';
const cls = d => d==null ? 'flat' : d>0 ? 'up' : d<0 ? 'down' : 'flat';
const arrow = d => d==null ? '' : d>0 ? '▲' : d<0 ? '▼' : '·';

fetch('./data.json').then(r=>r.json()).then(data => {
  document.getElementById('meta').textContent =
    `Current window: ${data.current.start} → ${data.current.end}  •  Previous: ${data.previous.start} → ${data.previous.end}  •  Generated ${data.generated_at}`;

  const root = document.getElementById('root');
  data.pages.forEach((p, i) => {
    const totClicks = p.daily.reduce((a,b)=>a+b.clicks,0);
    const totImpr   = p.daily.reduce((a,b)=>a+b.impressions,0);
    const avgCtr    = totImpr ? totClicks/totImpr : 0;
    const weighted  = p.daily.reduce((a,b)=>a+b.position*b.impressions,0);
    const avgPos    = totImpr ? weighted/totImpr : 0;

    const section = document.createElement('section');
    section.className = 'page';
    section.innerHTML = `
      <h2>${p.slug.replace('book-','').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
        <a href="${p.url}" target="_blank" rel="noopener">${p.url} ↗</a></h2>
      <div class="stats">
        <div class="stat"><div class="k">Clicks (28d)</div><div class="v">${totClicks}</div></div>
        <div class="stat"><div class="k">Impressions</div><div class="v">${totImpr}</div></div>
        <div class="stat"><div class="k">Avg CTR</div><div class="v">${fmtPct(avgCtr)}</div></div>
        <div class="stat"><div class="k">Avg Position</div><div class="v">${fmtPos(avgPos)}</div></div>
      </div>
      <div class="charts">
        <div class="chart-wrap"><h3>CTR — daily (%)</h3><canvas id="ctr-${i}"></canvas></div>
        <div class="chart-wrap"><h3>Average Position — daily (lower = better)</h3><canvas id="pos-${i}"></canvas></div>
      </div>
      <div class="chart-wrap" style="border-right:none;border-bottom:1px solid var(--line);">
        <h3>Top query impression deltas vs previous 28d</h3>
        <canvas id="delta-${i}" style="max-height:260px;"></canvas>
      </div>
      <table>
        <thead><tr><th>Query</th><th class="num">Impr</th><th class="num">Δ Impr</th><th class="num">CTR</th><th class="num">Pos</th><th class="num">Δ Pos</th></tr></thead>
        <tbody>${p.queries.slice(0,15).map(q=>`
          <tr>
            <td>${q.query}</td>
            <td class="num">${q.impressions}</td>
            <td class="num ${cls(q.impressions_delta)}">${arrow(q.impressions_delta)} ${q.impressions_delta>=0?'+':''}${q.impressions_delta}</td>
            <td class="num">${fmtPct(q.ctr)}</td>
            <td class="num">${fmtPos(q.position)}</td>
            <td class="num ${cls(q.position_delta)}">${q.position_delta==null?'new':(arrow(q.position_delta)+' '+q.position_delta.toFixed(1))}</td>
          </tr>`).join('')}</tbody>
      </table>`;
    root.appendChild(section);

    const labels = p.daily.map(d=>d.date.slice(5));
    const base = { responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}}, scales:{x:{ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:7,font:{size:10}}}}};

    new Chart(document.getElementById(`ctr-${i}`), {
      type:'line',
      data:{ labels, datasets:[{ data:p.daily.map(d=>+(d.ctr*100).toFixed(2)),
        borderColor:'#0a0a0a', backgroundColor:'rgba(211,47,47,0.08)', fill:true, tension:0.25, pointRadius:0 }]},
      options:{...base, scales:{...base.scales, y:{beginAtZero:true, ticks:{callback:v=>v+'%',font:{size:10}}}}}
    });

    new Chart(document.getElementById(`pos-${i}`), {
      type:'line',
      data:{ labels, datasets:[{ data:p.daily.map(d=>d.position||null),
        borderColor:'#d32f2f', backgroundColor:'rgba(211,47,47,0.06)', fill:true, tension:0.25, pointRadius:0, spanGaps:true }]},
      options:{...base, scales:{...base.scales, y:{reverse:true, ticks:{font:{size:10}}}}}
    });

    // Sort deltas: biggest climbers first (largest positive impressions_delta)
    const top = [...p.queries].sort((a,b)=>b.impressions_delta - a.impressions_delta).slice(0,12);
    new Chart(document.getElementById(`delta-${i}`), {
      type:'bar',
      data:{ labels:top.map(q=>q.query.length>34?q.query.slice(0,32)+'…':q.query),
        datasets:[{ data:top.map(q=>q.impressions_delta),
          backgroundColor:top.map(q=>q.impressions_delta>=0?'#0a7d2f':'#d32f2f') }]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{ticks:{font:{size:10}}, grid:{color:'#eee'}}, y:{ticks:{font:{size:11}}}}}
    });
  });
}).catch(e => { document.getElementById('meta').textContent = 'Failed to load data.json: '+e; });
</script>
</body>
</html>
