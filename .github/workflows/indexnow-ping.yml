name: IndexNow Ping

# Re-submits the site root to IndexNow after every push to the default
# branch (i.e. immediately after deployment of the static export), and
# can also be triggered manually. Confirms each endpoint returns HTTP 202.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to submit"
        required: false
        default: "https://tkctalent.com/"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URL to IndexNow and verify HTTP 202
        env:
          KEY: 377abe1193244f129029210522605df7
          URL: ${{ github.event.inputs.url || 'https://tkctalent.com/' }}
        run: |
          set -euo pipefail
          KEY_LOCATION="https://tkctalent.com/${KEY}.txt"
          fail=0
          for endpoint in \
            "https://api.indexnow.org/IndexNow" \
            "https://www.bing.com/indexnow"; do
            success=0
            for attempt in 1 2 3 4 5; do
              echo "Pinging ${endpoint} (attempt ${attempt}/5)"
              status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -G "${endpoint}" \
                --data-urlencode "url=${URL}" \
                --data-urlencode "key=${KEY}" \
                --data-urlencode "keyLocation=${KEY_LOCATION}")
              echo "  -> HTTP ${status}"
              cat /tmp/body.txt || true
              echo
              if [ "${status}" == "202" ]; then
                success=1
                break
              fi
              if [ "${attempt}" -lt 5 ]; then
                delay=$(( 2 ** (attempt - 1) ))
                echo "  Retrying in ${delay}s..."
                sleep "${delay}"
              fi
            done
            if [ "${success}" -ne 1 ]; then
              echo "::error::Expected HTTP 202 from ${endpoint}, never received after 5 attempts"
              fail=1
            fi
          done
          exit "${fail}"
  ping-priority-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Submit priority keyword pages to IndexNow
        env:
          KEY: 377abe1193244f129029210522605df7
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<JSON
          {"host":"tkctalent.com","key":"${KEY}","keyLocation":"https://tkctalent.com/${KEY}.txt","urlList":[
          "https://tkctalent.com/event-management-company/",
          "https://tkctalent.com/event-management-delhi/",
          "https://tkctalent.com/event-planners-delhi/",
          "https://tkctalent.com/event-management-gurgaon/",
          "https://tkctalent.com/wedding-planner-delhi/",
          "https://tkctalent.com/corporate-event-management/",
          "https://tkctalent.com/blog/corporate-event-management-india/",
          "https://tkctalent.com/celebrity-booking-india/",
          "https://tkctalent.com/pan-india-celebrity-booking/",
          "https://tkctalent.com/book-celebrity-for-wedding/",
          "https://tkctalent.com/celebrity-booking-delhi/",
          "https://tkctalent.com/bollywood-celebrity-booking/"]}
          JSON
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" --data @/tmp/payload.json)
          echo "IndexNow HTTP ${status}"; cat /tmp/body.txt || true
          case "${status}" in 200|202) exit 0;; *) exit 1;; esac
